name: DAMスコア取得

on:
  schedule:
    # 毎日 JST 2:00 と 14:00 に実行 (UTCではそれぞれ前日17:00, 当日05:00)
    - cron: "0 17 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dam-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install requests

      - name: (一時) ネットワーク疎通の切り分けテスト
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36"
          echo "== 1. ログインページ (Login.do) =="
          curl -s -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" -A "$UA" "https://www.clubdam.com/app/damtomo/auth/member/Login.do"
          echo "-- レスポンスヘッダー --"
          curl -s -D - -o /dev/null -A "$UA" "https://www.clubdam.com/app/damtomo/auth/member/Login.do" || true
          echo ""
          echo "== 2. 認証不要の公式ページ (曲検索) =="
          curl -s -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" -A "$UA" "https://www.clubdam.com/karaokesearch/songleaf.html?requestNo=4461-09"
          echo ""
          echo "== 3. clubdam.com トップページ =="
          curl -s -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" -A "$UA" "https://www.clubdam.com/"
          echo ""
          echo "== 4. 無関係な外部サイト (参考) =="
          curl -s -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" "https://www.google.com/"

      - name: スクレイピング実行
        env:
          DAM_LOGIN_ID: ${{ secrets.DAM_LOGIN_ID }}
          DAM_PASSWORD: ${{ secrets.DAM_PASSWORD }}
        run: python scripts/scrape_dam.py

      - name: 変更があればコミット&プッシュ
        run: |
          git config user.name "dam-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/data.json
          if git diff --cached --quiet; then
            echo "変更なし、コミットをスキップします"
          else
            git commit -m "採点データ更新 $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M JST')"
            git push
          fi
