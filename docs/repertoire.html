<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="レパートリー">
<meta name="theme-color" content="#05070C">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>レパートリー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#05070C; --bg-1:#0A0E17; --bg-2:#111726; --border-1:#1A2740; --border-2:#243349;
    --cyan:#2DE9DC; --cyan-dim:#1B9E96; --magenta:#FF3D8A; --amber:#FF8A3D; --violet:#9D8CFF;
    --text-1:#EAF2FA; --text-2:#6C8299;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg-0);color:var(--text-1);font-family:'Noto Sans JP',sans-serif;min-height:100vh;padding-bottom:calc(3rem + env(safe-area-inset-bottom));}
  .wrap{max-width:720px;margin:0 auto;}

  .head{padding:18px 16px 10px;}
  .eyebrow{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--cyan-dim);}
  h1{margin:4px 0 0;font-size:22px;font-weight:700;text-wrap:balance;}
  .mock{margin-top:8px;font-size:11px;color:var(--text-2);line-height:1.6;}

  .controls{position:sticky;top:0;z-index:5;background:rgba(5,7,12,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:10px 16px 10px;border-bottom:1px solid var(--border-1);}
  .search{width:100%;background:var(--bg-1);border:1px solid var(--border-2);color:var(--text-1);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;}
  .search::placeholder{color:var(--text-2);}
  .search:focus-visible,.sort:focus-visible,.chip:focus-visible,.card:focus-visible,.star:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
  .row2{display:flex;gap:8px;align-items:center;margin-top:8px;}
  .chips{display:flex;gap:6px;overflow-x:auto;flex:1;padding-bottom:2px;scrollbar-width:none;-ms-overflow-style:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;border:1px solid var(--border-2);background:none;color:var(--text-2);border-radius:999px;padding:6px 12px;font-size:12.5px;font-family:inherit;white-space:nowrap;cursor:pointer;}
  .chip i{font-style:normal;font-family:'Share Tech Mono',monospace;margin-left:5px;opacity:.75;}
  .chip.g{border-color:#3A3566;color:var(--violet);}
  .chip.g.on{background:var(--violet);border-color:var(--violet);color:#120F33;font-weight:700;}
  .tags{font-size:11px;color:var(--violet);margin-top:3px;opacity:.9;}
  .chip.on{background:var(--cyan);border-color:var(--cyan);color:#04211F;font-weight:700;}
  .sortrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;}
  .count{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--text-2);}
  .sort{background:var(--bg-1);color:var(--text-1);border:1px solid var(--border-2);border-radius:8px;padding:7px 8px;font-size:13px;font-family:inherit;max-width:60%;}

  .list{padding:12px 16px 0;display:flex;flex-direction:column;gap:8px;}
  .card{background:var(--bg-1);border:1px solid var(--border-1);border-radius:10px;padding:11px 12px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;}
  .card.open{border-color:var(--border-2);background:var(--bg-2);}
  .best{flex:0 0 auto;min-width:58px;text-align:center;background:var(--bg-0);border:1px solid var(--border-1);border-radius:8px;padding:6px 4px 5px;}
  .best b{display:block;font-family:'Share Tech Mono',monospace;font-size:18px;font-weight:400;color:var(--magenta);line-height:1.1;}
  .best span{display:block;font-size:9.5px;color:var(--text-2);margin-top:2px;letter-spacing:.08em;}
  .body{flex:1;min-width:0;}
  .title{font-size:14.5px;font-weight:700;line-height:1.35;overflow-wrap:anywhere;}
  .artist{font-size:11.5px;color:var(--text-2);margin-top:2px;overflow-wrap:anywhere;}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px;}
  .key{display:inline-block;border:1px solid var(--amber);color:var(--amber);border-radius:5px;padding:1px 9px;font-size:16px;font-weight:700;font-family:'Share Tech Mono',monospace;line-height:1.45;}
  .key small{font-family:'Noto Sans JP',sans-serif;font-size:10.5px;font-weight:500;margin-right:5px;opacity:.85;}
  .sub{font-size:12px;color:var(--text-2);font-family:'Share Tech Mono',monospace;}
  .sub em{font-style:normal;color:var(--text-1);}
  .star{flex:0 0 auto;background:none;border:none;color:var(--text-2);font-size:22px;line-height:1;padding:4px 2px 4px 6px;cursor:pointer;}
  .star.on{color:var(--amber);}
  .detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-1);grid-template-columns:1fr 1fr;gap:8px 12px;}
  .card.open .detail{display:grid;}
  .detail div{font-size:11px;color:var(--text-2);}
  .detail b{display:block;font-family:'Share Tech Mono',monospace;font-weight:400;font-size:14px;color:var(--text-1);margin-top:1px;}
  .detail .wide{grid-column:1 / -1;}
  .detail b.v{color:var(--violet);}
  .detail b.c{color:var(--cyan);}
  .empty{padding:2.5rem 1rem;text-align:center;color:var(--text-2);font-size:13px;}
  .foot{padding:18px 16px 0;font-size:11px;color:var(--text-2);line-height:1.7;}
  [hidden]{display:none!important;}
  .tabs{display:flex;gap:8px;margin-bottom:10px;}
  .tab{flex:1;padding:9px 6px;border-radius:10px;border:1px solid var(--border-2);background:none;color:var(--text-2);font-family:inherit;font-size:14px;cursor:pointer;}
  .tab i{font-style:normal;font-family:'Share Tech Mono',monospace;margin-left:6px;color:var(--amber);}
  .tab.on{background:var(--bg-2);color:var(--text-1);border-color:var(--cyan);font-weight:700;}
  .tab:focus-visible,.cat:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
  .sec{display:flex;justify-content:space-between;align-items:baseline;margin:10px 2px 0;font-size:13px;font-weight:700;color:var(--cyan);}
  .sec span:last-child{font-family:'Share Tech Mono',monospace;font-size:12px;font-weight:400;color:var(--text-2);}
  .cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .cat{border:1px solid var(--border-2);background:none;color:var(--text-2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-family:inherit;cursor:pointer;}
  .cat.on{background:var(--violet);border-color:var(--violet);color:#120F33;font-weight:700;}
  .acts{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .nx{border:1px solid var(--border-2);background:none;color:var(--text-2);border-radius:999px;padding:4px 9px;font-size:11.5px;font-family:inherit;white-space:nowrap;cursor:pointer;}
  .nx.on{background:var(--violet);border-color:var(--violet);color:#120F33;font-weight:700;}
  .nx:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
</style>

</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="eyebrow">KARAOKE LOG</div>
    <h1>レパートリー</h1>
    <div class="mock" id="upd">読み込み中...</div>
  </div>

  <div class="controls">
    <div class="tabs"><button class="tab on" data-t="rep">レパートリー</button><button class="tab" data-t="next">次回歌う<i id="nc">0</i></button><button class="tab" data-t="fav">★お気に入り<i id="fc">0</i></button></div>
    <div id="filters">
    <input id="q" class="search" type="search" placeholder="曲名・歌手で検索" autocomplete="off" enterkeyhint="search">
    <div class="row2"><div class="chips" id="chips"></div></div>
    <div class="row2"><div class="chips" id="gchips"></div></div>
    <div class="sortrow">
      <div class="count" id="count"></div>
      <select id="sort" class="sort" aria-label="並べ替え">
        <option value="n">歌った回数が多い順</option>
        <option value="best">最高点が高い順</option>
        <option value="avg">平均点が高い順</option>
        <option value="r5">直近5回の点が高い順</option>
        <option value="lastNew">最近歌った順</option>
        <option value="lastOld">歌ってから日が経った順</option>
      </select>
    </div>
    </div>
  </div>

  <div class="list" id="list"></div>
  <div class="foot">キーはDAMのリモコンに入れる値(機種の標準キーからの差)で、直近5回で一番多かったものを表示しています。「原曲」はDAMの原曲キーとの差で、キーを決める時の参考にしてください。ジャンルは歌手名などから自動で付けたもので、間違いがあることがあります。お気に入り・次回歌う・分類は、このスマホの中にだけ保存されます。</div>
</div>

<script>
let DATA = [];
const DAY = 86400000;
const NOW = Date.now();
const days = (s) => Math.max(0, Math.floor((NOW - new Date(s + 'T00:00:00').getTime()) / DAY));
const fk = (k) => k == null ? '-' : (k > 0 ? '+' + k : String(k));
const ago = (n) => n === 0 ? '今日' : n === 1 ? '昨日' : n < 31 ? n + '日前' : n < 365 ? Math.floor(n / 30) + 'か月前' : Math.floor(n / 365) + '年前';
const modeName = { ai: 'Ai', dxg: 'DX-G', hearts: 'Ai Heart' };
const id = (r) => r.t + '|' + r.a;
const CATS = ['未分け', '鉄板', '久しぶり', '練習中', 'お試し', 'その他'];

let next = {};
try { next = JSON.parse(localStorage.getItem('rep_next_v1') || '{}') || {}; } catch (e) { next = {}; }
const saveNext = () => { try { localStorage.setItem('rep_next_v1', JSON.stringify(next)); } catch (e) {} };
let fav = new Set();
try { fav = new Set(JSON.parse(localStorage.getItem('rep_fav_v1') || '[]')); } catch (e) { fav = new Set(); }
const saveFav = () => { try { localStorage.setItem('rep_fav_v1', JSON.stringify([...fav])); } catch (e) {} };

const CHIPS = [
  ['all', 'すべて', () => true],
  ['fav', '★ お気に入り', (r) => fav.has(id(r))],
  ['nxt', '次回', (r) => id(r) in next],
  ['core', '十八番 10回〜', (r) => r.n >= 10],
  ['high', '高得点 91〜', (r) => r.best >= 91],
  ['rest', '久しぶり 2週間〜', (r) => r.n >= 2 && days(r.last) >= 14],
  ['trial', 'お試し 1回', (r) => r.n === 1]
];
const SORTS = {
  n: (a, b) => b.n - a.n || b.best - a.best,
  best: (a, b) => b.best - a.best || b.n - a.n,
  avg: (a, b) => b.avg - a.avg,
  r5: (a, b) => b.r5 - a.r5,
  lastNew: (a, b) => b.last.localeCompare(a.last),
  lastOld: (a, b) => a.last.localeCompare(b.last)
};
const GENRES = ['アニメ', '特撮', 'ゲーム・ボカロ', 'J-POP', 'ロック', '90年代', '昭和歌謡', '演歌', 'ダンス', 'アイドル', '未分類'];

let tab = 'rep', chip = 'all', genre = null, open = null;
const $ = (s) => document.querySelector(s);
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function renderChips() {
  $('#chips').innerHTML = CHIPS.map(([k, label, f]) =>
    `<button class="chip ${k === chip ? 'on' : ''}" data-k="${k}">${label}<i>${DATA.filter(f).length}</i></button>`).join('');
}
function renderG() {
  $('#gchips').innerHTML = GENRES.map((g) =>
    `<button class="chip g ${g === genre ? 'on' : ''}" data-g="${g}">${g}<i>${DATA.filter((r) => r.g.includes(g)).length}</i></button>`).join('');
}

function cardHtml(r, withCats) {
  const i = id(r), d = days(r.last), isOpen = open === i, on = i in next, isFav = fav.has(i), enc = encodeURIComponent(i);
  return `<div class="card ${isOpen ? 'open' : ''}" data-i="${enc}" tabindex="0" role="button" aria-expanded="${isOpen}">
    <div class="best"><b>${r.best.toFixed(1)}</b><span>最高</span></div>
    <div class="body">
      <div class="title">${esc(r.t)}</div>
      <div class="artist">${esc(r.a)}</div>
      <div class="tags">${r.g.join(' ・ ')}</div>
      <div class="meta">
        <span class="key"><small>キー</small>${fk(r.key)}</span>
        <span class="sub"><em>${r.n}</em>回</span>
        <span class="sub">${ago(d)}</span>
      </div>
      ${withCats ? `<div class="cats">${CATS.map((c) => `<button class="cat ${next[i] === c ? 'on' : ''}" data-i="${enc}" data-c="${c}">${c}</button>`).join('')}</div>` : ''}
      <div class="detail">
        <div>平均点<b>${r.avg.toFixed(2)}</b></div>
        <div>直近5回の平均<b>${r.r5.toFixed(2)}</b></div>
        <div>直近5回でこのキー<b>${r.keyN} / ${Math.min(5, r.n)}回</b></div>
        <div>全期間でよく使うキー<b>${fk(r.keyAll)}</b></div>
        <div>最高点を出したキー<b class="c">${fk(r.bestKey)}</b></div>
        <div>DAMの原曲キー(差)<b class="v">${r.orig == null ? '-' : fk(r.orig)}</b></div>
        <div>初めて歌った日<b>${r.first.replace(/-/g, '/')}</b></div>
        <div>最後に歌った日<b>${r.last.replace(/-/g, '/')}</b></div>
        <div class="wide">歌ったモード<b>${r.modes.map((m) => modeName[m]).join(' / ')}</b></div>
      </div>
    </div>
    <div class="acts">
      <button class="star ${isFav ? 'on' : ''}" data-s="${enc}" aria-label="お気に入り">${isFav ? '★' : '☆'}</button>
      <button class="nx ${on ? 'on' : ''}" data-n="${enc}" aria-label="次回歌う">${on ? '次回✓' : '＋次回'}</button>
    </div>
  </div>`;
}

function updateTabs() {
  $('#nc').textContent = Object.keys(next).length;
  $('#fc').textContent = fav.size;
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.t === tab));
  $('#filters').hidden = tab !== 'rep';
}

function renderNext() {
  const byId = new Map(DATA.map((r) => [id(r), r]));
  const items = Object.keys(next).map((i) => byId.get(i)).filter(Boolean);
  if (!items.length) {
    $('#list').innerHTML = '<div class="empty">レパートリーで「＋次回」をタップすると、ここに入ります。<br>入れたあと、ここで「鉄板」「久しぶり」などに分類できます。</div>';
    return;
  }
  $('#list').innerHTML = CATS.map((c) => {
    const rs = items.filter((r) => next[id(r)] === c).sort(SORTS.n);
    return rs.length ? `<div class="sec"><span>${c}</span><span>${rs.length}曲</span></div>` + rs.map((r) => cardHtml(r, true)).join('') : '';
  }).join('');
}

function renderFav() {
  const rs = DATA.filter((r) => fav.has(id(r))).sort(SORTS.n);
  $('#list').innerHTML = rs.length
    ? `<div class="sec"><span>お気に入り</span><span>${rs.length}曲</span></div>` + rs.map((r) => cardHtml(r, false)).join('')
    : '<div class="empty">曲の☆をタップすると、ここに入ります。<br>(次回歌う曲とは別に、ずっと残るお気に入りです)</div>';
}

function render() {
  updateTabs();
  if (tab === 'next') { renderNext(); return; }
  if (tab === 'fav') { renderFav(); return; }
  const q = $('#q').value.trim().toLowerCase();
  const f = CHIPS.find((c) => c[0] === chip)[2];
  const rows = DATA.filter(f).filter((r) => !genre || r.g.includes(genre)).filter((r) => !q || (r.t + ' ' + r.a).toLowerCase().includes(q)).sort(SORTS[$('#sort').value]);
  $('#count').textContent = `${DATA.length}曲中 ${rows.length}曲`;
  $('#list').innerHTML = rows.length ? rows.map((r) => cardHtml(r, false)).join('') : '<div class="empty">該当する曲がありません</div>';
}

document.querySelector('.tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab'); if (!b) return;
  tab = b.dataset.t; open = null; window.scrollTo(0, 0); render();
});
$('#chips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  chip = b.dataset.k; renderChips(); render();
});
$('#gchips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  genre = genre === b.dataset.g ? null : b.dataset.g; renderG(); render();
});
$('#q').addEventListener('input', render);
$('#sort').addEventListener('change', render);
$('#list').addEventListener('click', (e) => {
  const cb = e.target.closest('.cat');
  if (cb) { next[decodeURIComponent(cb.dataset.i)] = cb.dataset.c; saveNext(); render(); return; }
  const n = e.target.closest('.nx');
  if (n) {
    const i = decodeURIComponent(n.dataset.n);
    if (i in next) delete next[i]; else next[i] = '未分け';
    saveNext(); renderChips(); render(); return;
  }
  const s = e.target.closest('.star');
  if (s) {
    const i = decodeURIComponent(s.dataset.s);
    if (fav.has(i)) fav.delete(i); else fav.add(i);
    saveFav(); renderChips(); render(); return;
  }
  const c = e.target.closest('.card'); if (!c) return;
  const i = decodeURIComponent(c.dataset.i);
  open = open === i ? null : i; render();
});
$('#list').addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) { e.preventDefault(); e.target.click(); }
});
const CACHE_KEY = 'rep_data_v1';
function fmtUpd(iso, note) {
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `更新 ${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}${note || ''}`;
}
function start(j, note) {
  DATA = j.songs;
  $('#upd').textContent = fmtUpd(j.updatedAt, note);
  renderChips(); renderG(); render();
}
fetch('./repertoire.json?_=' + Date.now())
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((j) => {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(j)); } catch (e) {}
    start(j, '');
  })
  .catch(() => {
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) {}
    if (cached && cached.songs) { start(cached, '(オフライン: 前回のデータ)'); }
    else { $('#upd').textContent = ''; $('#list').innerHTML = '<div class="empty">データを読み込めませんでした。電波の良い所で開き直してください。</div>'; }
  });
</script>

</body>
</html>
