<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カラオケ記録">
<meta name="theme-color" content="#05070C">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>カラオケ記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="./assets/cyber-space.webp">
<style>
  :root{
    --bg-0:#05070C; --bg-1:#0A0E17; --bg-2:#111726; --border-1:#1A2740; --border-2:#243349;
    --cyan:#2DE9DC; --cyan-dim:#1B9E96; --magenta:#FF3D8A; --magenta-dim:#B32C61; --amber:#FF8A3D; --violet:#9D8CFF;
    --text-1:#EAF2FA; --text-2:#6C8299;
    --maxw:720px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:'Noto Sans JP',sans-serif;background:var(--bg-0);color:var(--text-1);min-height:100vh;padding-bottom:3rem;}
  .wrap{max-width:var(--maxw);margin:0 auto;}

  .header{position:relative;isolation:isolate;overflow:hidden;margin:12px;border:1px solid #235e84;border-radius:12px;background:#020a18;box-shadow:0 0 32px #00b8fa12;}
  .hero-scene{position:relative;min-height:276px;background:url('./assets/cyber-space.webp') center/cover no-repeat;}
  .hero-scene::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#02091685,transparent 74%),linear-gradient(0deg,#020916d9,transparent 35%);pointer-events:none;}
  .hero-scene::after{content:'';position:absolute;inset:14px;border:1px solid #32eaff33;clip-path:polygon(0 0,20px 0,20px 1px,1px 1px,1px 20px,0 20px,0 0,100% 0,100% 20px,calc(100% - 1px) 20px,calc(100% - 1px) 1px,calc(100% - 20px) 1px,calc(100% - 20px) 0,100% 0,100% 100%,calc(100% - 20px) 100%,calc(100% - 20px) calc(100% - 1px),calc(100% - 1px) calc(100% - 1px),calc(100% - 1px) calc(100% - 20px),100% calc(100% - 20px),100% 100%,0 100%,0 calc(100% - 20px),1px calc(100% - 20px),1px calc(100% - 1px),20px calc(100% - 1px),20px 100%,0 100%);pointer-events:none;}
  .hero-copy{position:relative;z-index:2;padding:57px 30px 76px;}
  .hero-eyebrow{display:flex;align-items:center;gap:12px;margin:0 0 13px;color:#83efff;font:10px 'Share Tech Mono',monospace;letter-spacing:0.25em;}
  .hero-eyebrow::after{content:'';width:46px;height:1px;background:linear-gradient(90deg,#55eaff,transparent);}
  .hero-title{width:max-content;max-width:100%;margin:0;color:#f0fcff;font-size:clamp(36px,7.7vw,56px);font-weight:900;line-height:1.3;letter-spacing:-0.045em;transform:skewX(-7deg);text-shadow:1px 2px 0 #087eaa,-1px -1px 0 #d8ffff,3px 3px 0 #772ac0,0 0 22px #27ceff70;}
  .hero-title span{background:linear-gradient(170deg,#fff 27%,#e5fcff 52%,#65e5ff 80%,#bc94ff);background-clip:text;-webkit-background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(1px 2px 0 #1488ba) drop-shadow(2px 2px 0 #7338bf) drop-shadow(0 0 10px #23d2ff60);}
  .hero-subtitle{display:flex;align-items:center;gap:12px;margin:12px 0 0;color:#d1e5fa;font-size:13px;letter-spacing:0.13em;text-shadow:0 2px 8px #000;}
  .hero-subtitle::before{content:'';width:23px;height:1px;background:#36eaff;box-shadow:0 0 8px #36eaff;}
  .hero-caption{position:absolute;z-index:2;bottom:20px;left:30px;margin:0;color:#92c6e0;font:9px 'Share Tech Mono',monospace;letter-spacing:0.16em;}
  .hero-motion{position:absolute;z-index:3;top:17px;right:18px;padding:5px 8px;border:1px solid #4fc6f04d;border-radius:3px;background:#031123bf;color:#a7cbe3;font:10px 'Share Tech Mono',monospace;cursor:pointer;}
  .hero-motion:hover{border-color:#69eaff;color:#fff;}
  .hero-motion:focus-visible{outline:2px solid #74efff;outline-offset:3px;}
  .hero-particles,.hero-scan{position:absolute;inset:0;pointer-events:none;}
  .hero-particles{background:radial-gradient(circle at 13% 73%,#9fffff 0 1px,transparent 2px),radial-gradient(circle at 40% 80%,#2ceaff 0 1px,transparent 2px),radial-gradient(circle at 68% 24%,#e0acff 0 1px,transparent 2px),radial-gradient(circle at 87% 64%,#bc99ff 0 1px,transparent 2px),radial-gradient(circle at 55% 48%,#77eeff 0 1px,transparent 2px);animation:hero-drift 7s ease-in-out infinite alternate;}
  .hero-scan{inset:0 auto 0 -40%;width:30%;background:linear-gradient(100deg,transparent,#62ddff08,#6adfff22,transparent);transform:skewX(-20deg);animation:hero-sweep 10s ease-in-out infinite;mix-blend-mode:screen;}
  @keyframes hero-drift{from{transform:translate3d(0,9px,0);opacity:0.35;}to{transform:translate3d(10px,-10px,0);opacity:1;}}
  @keyframes hero-sweep{0%,15%{left:-40%;opacity:0;}25%{opacity:1;}70%,100%{left:120%;opacity:0;}}
  .header[data-motion="off"] .hero-particles,.header[data-motion="off"] .hero-scan{animation:none;}
  .header[data-motion="off"] .hero-scan{display:none;}
  .hero-telemetry{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px;border-top:1px solid #28bdff40;background:linear-gradient(100deg,#071323,#0a0b21);}
  .hero-metrics{display:flex;align-items:center;gap:18px;margin:0;}
  .hero-metric dt{color:#91b0c8;font:9px 'Share Tech Mono',monospace;letter-spacing:0.13em;}
  .hero-metric dd{margin:3px 0 0;color:#e4fbff;font:18px 'Share Tech Mono',monospace;}
  .hero-metric dd small{margin-left:3px;color:#95acc4;font:10px 'Noto Sans JP',sans-serif;}
  .hero-trend{width:80px;height:27px;color:#57e7ff;}
  .hero-sync{text-align:right;min-width:0;}
  .hero-sync-state{display:flex;align-items:center;justify-content:flex-end;gap:7px;color:#77eeff;font:10px 'Share Tech Mono',monospace;letter-spacing:0.1em;}
  .hero-sync-state::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 9px currentColor;}
  .hero-updated{display:block;margin-top:5px;color:#91a9c4;font:9px 'Share Tech Mono',monospace;}
  .header[data-sync="error"] .hero-sync-state{color:#ffb879;}
  @media(max-width:480px){
    .hero-scene{min-height:270px;background-position:65% center;}
    .hero-scene::before{background:linear-gradient(90deg,#020916b3,transparent),linear-gradient(0deg,#020916c9,transparent 40%);}
    .hero-copy{padding:63px 21px 82px;}
    .hero-eyebrow{font-size:8px;letter-spacing:0.18em;gap:8px;}
    .hero-eyebrow::after{width:24px;}
    .hero-title{font-size:clamp(32px,9.7vw,46px);}
    .hero-subtitle{font-size:11px;letter-spacing:0.08em;}
    .hero-caption{left:22px;bottom:20px;font-size:8px;letter-spacing:0.08em;}
    .hero-telemetry{padding:12px 14px;gap:8px;}
    .hero-metrics{gap:12px;}
    .hero-metric dd{font-size:16px;}
    .hero-trend{display:none;}
    .hero-sync-state{font-size:9px;letter-spacing:0.04em;}
    .hero-updated{font-size:8px;}
  }
  @media(prefers-reduced-motion:reduce){.hero-particles,.hero-scan{animation:none!important;}.hero-scan{display:none;}}

  .section{padding:1.1rem 1.1rem 0;}
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:6px 14px;border-radius:999px;border:1px solid var(--border-2);color:var(--text-2);font-size:12.5px;white-space:nowrap;cursor:pointer;background:none;font-family:'Share Tech Mono',monospace;}
  .chip.active{background:var(--cyan);color:#04211F;border-color:var(--cyan);font-weight:700;}

  .tabs{display:flex;gap:6px;margin-top:14px;border-bottom:1px solid var(--border-1);}
  .tab{flex:1;padding:9px 0;border:none;background:none;border-bottom:2px solid transparent;font-size:13px;color:var(--text-2);cursor:pointer;}
  .tab.active{border-bottom-color:var(--cyan);color:var(--text-1);font-weight:700;}

  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
  .item-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px;}
  .stat-card{background:var(--bg-1);border:1px solid var(--border-1);border-radius:8px;padding:0.75rem;}
  .stat-label{font-size:11px;color:var(--text-2);margin-bottom:4px;}
  .stat-value{font-family:'Share Tech Mono',monospace;font-size:1.25rem;color:var(--cyan);}
  .stat-value.accent-score{color:var(--magenta);}

  .item-card{padding:0.5rem 0.6rem;}
  .item-card .stat-label{font-size:12px;margin-bottom:2px;}
  .item-card .stat-value{font-size:24px;}

  .dist-wrap{margin-top:8px;background:var(--bg-1);border:1px solid var(--border-1);border-radius:8px;padding:0.75rem 0.9rem;}
  .dist-title{font-size:11px;color:var(--text-2);margin-bottom:8px;}
  .dist-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .dist-row:last-child{margin-bottom:0;}
  .dist-label{width:76px;flex-shrink:0;font-size:11px;color:var(--text-2);font-family:'Share Tech Mono',monospace;}
  .dist-track{flex:1;height:14px;background:var(--bg-0);border:1px solid var(--border-1);border-radius:4px;overflow:hidden;}
  .dist-fill{height:100%;border-radius:3px;min-width:2px;transition:width 0.3s;}
  .dist-count{width:34px;flex-shrink:0;text-align:right;font-size:11px;color:var(--text-1);font-family:'Share Tech Mono',monospace;}

  .custom-range{display:none;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .custom-range.show{display:flex;}
  .custom-range input[type="date"]{background:var(--bg-1);border:1px solid var(--border-2);color:var(--text-1);border-radius:6px;padding:5px 7px;font-family:'Share Tech Mono',monospace;font-size:12px;color-scheme:dark;}
  .custom-range span{color:var(--text-2);font-size:12px;}

  .history-list{margin-top:14px;}
  .entry{background:var(--bg-1);border:1px solid var(--border-1);border-left:2px solid var(--cyan-dim);border-radius:8px;padding:0.7rem 0.9rem;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;}
  .entry-score{font-family:'Share Tech Mono',monospace;font-size:1.1rem;color:var(--magenta);background:var(--bg-0);border:1px solid var(--border-1);border-radius:6px;padding:5px 4px;min-width:62px;text-align:center;flex-shrink:0;}
  .entry-body{flex:1;min-width:0;}
  .entry-song{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-1);}
  .entry-song-link{background:none;border:none;padding:0;margin:0;font:inherit;font-weight:700;color:var(--cyan);text-decoration:underline;cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
  .entry-head{display:flex;align-items:center;gap:6px;}
  .entry-chevron{flex-shrink:0;color:var(--text-2);font-size:10px;transition:transform 0.2s;}
  .entry-chevron.open{transform:rotate(180deg);}
  .entry-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-1);}
  .entry-detail.open{display:block;}
  .detail-stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
  .detail-chart-title{font-size:11px;color:var(--text-2);margin:10px 0 6px;}
  .detail-chart-wrap{position:relative;width:100%;height:130px;}
  .entry-artist{font-size:11.5px;color:var(--text-2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .entry-date{font-size:10.5px;color:var(--text-2);opacity:0.8;margin-top:2px;font-family:'Share Tech Mono',monospace;}
  .entry-key{display:inline-block;margin-left:6px;padding:2px 8px;border:1px solid var(--amber);border-radius:4px;color:var(--amber);opacity:1;font-size:16px;font-weight:700;}
  .entry-origkey{display:inline-block;margin-left:6px;padding:2px 8px;border:1px solid var(--violet);border-radius:4px;color:var(--violet);opacity:1;font-size:16px;font-weight:700;}
  .entry-items{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;}
  .entry-item{font-size:10.5px;color:var(--text-2);white-space:nowrap;}
  .entry-item b{color:var(--cyan);font-family:'Share Tech Mono',monospace;font-weight:400;}
  .empty{text-align:center;padding:2.5rem 1rem;color:var(--text-2);font-size:13px;}
  .pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px;}
  .pager-btn{background:var(--bg-1);border:1px solid var(--border-2);color:var(--text-1);border-radius:6px;padding:7px 16px;font-size:12.5px;cursor:pointer;font-family:'Share Tech Mono',monospace;}
  .pager-btn:disabled{opacity:0.35;cursor:default;}
  .pager-info{font-size:11.5px;color:var(--text-2);font-family:'Share Tech Mono',monospace;}
  .footer-note{text-align:center;font-size:11px;color:var(--text-2);opacity:0.6;padding:2rem 1rem 0.5rem;font-family:'Share Tech Mono',monospace;letter-spacing:0.1em;}

  @media (min-width:600px){
    .stats-row{grid-template-columns:repeat(4,1fr);}
    .item-grid{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="header" id="headerGraphic" data-sync="loading" data-motion="off">
    <div class="hero-scene">
      <div class="hero-particles" aria-hidden="true"></div>
      <div class="hero-scan" aria-hidden="true"></div>
      <button class="hero-motion" id="heroMotion" type="button" aria-pressed="false" aria-label="背景アニメーション">演出 OFF</button>
      <div class="hero-copy">
        <p class="hero-eyebrow">KARAOKE // NEURAL ARCHIVE</p>
        <h1 class="hero-title"><span>カラオケ記録</span></h1>
        <p class="hero-subtitle">DAM★とも 自動連携</p>
      </div>
      <p class="hero-caption">SONG ANALYSIS &nbsp; / &nbsp; SCORE TRENDS &nbsp; / &nbsp; PERSONAL DATA</p>
    </div>
    <div class="hero-telemetry">
      <dl class="hero-metrics">
        <div class="hero-metric"><dt>TOTAL LOGS</dt><dd><span id="heroCount">—</span><small>曲</small></dd></div>
        <div class="hero-metric"><dt>AVG SCORE</dt><dd id="heroAverage">—</dd></div>
      </dl>
      <svg class="hero-trend" id="heroTrend" viewBox="0 0 80 28" role="img" aria-label="直近9回の採点スコア推移"></svg>
      <div class="hero-sync"><span class="hero-sync-state" id="heroSyncState" role="status">LOADING</span><time class="hero-updated" id="heroUpdated">更新日時を確認中</time></div>
    </div>
  </header>

  <div class="section">
    <div class="chip-row" id="periodBar">
      <button class="chip active" data-period="all">全期間</button>
      <button class="chip" data-period="year">今年</button>
      <button class="chip" data-period="30d">直近30日</button>
      <button class="chip" data-period="month">今月</button>
      <button class="chip" data-period="custom">期間指定</button>
    </div>
    <div class="custom-range" id="customRange">
      <input type="date" id="customStart">
      <span>〜</span>
      <input type="date" id="customEnd">
    </div>

    <div class="tabs" id="modeTabs">
      <button class="tab active" data-mode="ai">精密採点Ai</button>
      <button class="tab" data-mode="dxg">DX-G</button>
      <button class="tab" data-mode="hearts">Ai Heart</button>
    </div>

    <div class="stats-row" id="statsRow"></div>
    <div class="item-grid" id="itemGrid"></div>
    <div class="dist-wrap">
      <div class="dist-title">スコア分布</div>
      <div id="distChart"></div>
    </div>
    <div id="rangeCard"></div>

    <p style="font-size:13px;font-weight:500;margin:20px 0 8px;color:var(--text-1);">履歴</p>
    <div class="history-list" id="historyList"></div>
    <div class="pager" id="pager"></div>
  </div>

  <p class="footer-note">GITHUB ACTIONS 経由で自動更新</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}

// 実際のAPIレスポンスのフィールド名が確定するまでの間、候補を順に探す
const FIELD_CANDIDATES = {
  song: ['contentsName', 'songName', 'title'],
  artist: ['artistName', 'artist', 'singer'],
  score: ['score', 'totalScore', 'point'],
  date: ['scoringDateTime', 'date', 'scoringDate', 'playDate'],
};

// 曲ごとの技法回数(しゃくり・こぶし・フォール・アクセント・ハンマリング・ビブラート)
const TECHNIQUE_LABELS = {
  ai: [['しゃくり','shakuriCount'],['こぶし','kobushiCount'],['フォール','fallCount'],['ビブラート','vibratoCount']],
  dxg: [['しゃくり','shakuriCount'],['こぶし','kobushiCount'],['フォール','fallCount'],['ビブラート','vibratoCount']],
  hearts: [['しゃくり','shakuriCount'],['こぶし','kobushiCount'],['フォール','fallCount'],['アクセント','accentCount'],['ハンマリング','hammeringOnCount'],['ロングトーン','longtoneCount'],['ビブラート','vibratoCount']],
};

// ミニレーダーチャート用の軸(モードによって聴感が入るかどうかが違う)
const RADAR_AXES = {
  ai: ['radarChartPitch','radarChartStability','radarChartExpressive','radarChartRhythm','radarChartVibratoLongtone'],
  dxg: ['radarChartPitch','radarChartStability','radarChartExpressive','radarChartRhythm','radarChartVibratoLongtone'],
  hearts: ['radarChartPitch','radarChartStability','radarChartExpressive','radarChartHearing','radarChartRhythm','radarChartVibratoLongtone'],
};

// レーダーチャートの軸ラベル(短縮表記)
const RADAR_LABELS = {
  radarChartPitch: '音程',
  radarChartStability: '安定性',
  radarChartExpressive: '表現力',
  radarChartRhythm: 'リズム',
  radarChartVibratoLongtone: 'ロング/ビブ',
  radarChartHearing: '聴感',
};

// ビブラートタイプ(1〜14の通し番号 → 公式の表示名)
const VIBRATO_TYPE_LABELS = {
  1: 'ボックス形(A-1)', 2: 'ボックス形(A-2)', 3: 'ボックス形(A-3)',
  4: 'ボックス形(B-1)', 5: 'ボックス形(B-2)', 6: 'ボックス形(B-3)',
  7: 'ボックス形(C-1)', 8: 'ボックス形(C-2)', 9: 'ボックス形(C-3)',
  10: '上昇形(D)', 11: '下降形(E)', 12: '縮小形(F)', 13: '拡張形(G)', 14: 'ひし形(H)',
};

const ITEM_LABELS = {
  ai: [
    ['音程', ['radarChartPitch']],
    ['安定性', ['radarChartStability']],
    ['表現力', ['radarChartExpressive']],
    ['リズム', ['radarChartRhythm']],
    ['ロングトーン・ビブラート', ['radarChartVibratoLongtone']],
    ['Ai感性', ['aiSensitivityPoints']],
    ['Aiボーナス', ['aiSensitivityBonus'], 1000],
  ],
  dxg: [
    ['音程', ['radarChartPitch']],
    ['安定性', ['radarChartStability']],
    ['表現力', ['radarChartExpressive']],
    ['リズム', ['radarChartRhythm']],
    ['ロングトーン・ビブラート', ['radarChartVibratoLongtone']],
  ],
  hearts: [
    ['音程', ['radarChartPitch']],
    ['安定性', ['radarChartStability']],
    ['表現力', ['radarChartExpressive']],
    ['リズム', ['radarChartRhythm']],
    ['ロングトーン・ビブラート', ['radarChartVibratoLongtone']],
    ['聴感', ['radarChartHearing']],
    ['ハートボーナス', ['hearingPoint'], 1000],
  ],
};

// スコア分布の区分(下限は含む、上限は含まない。最後だけ95以上)
const DIST_BINS = [
  { label: '〜85未満', min: -Infinity, max: 85, color: '#6C8299' },
  { label: '85〜88', min: 85, max: 88, color: '#4FC3F7' },
  { label: '88〜90', min: 88, max: 90, color: '#4ADE80' },
  { label: '90〜93', min: 90, max: 93, color: '#FF3D8A' },
  { label: '93〜95', min: 93, max: 95, color: '#E63950' },
  { label: '95以上', min: 95, max: Infinity, color: '#B983FF' },
];

function renderDistribution(scores) {
  const distEl = document.getElementById('distChart');
  if (!distEl) return;
  const counts = DIST_BINS.map(bin => scores.filter(s => s >= bin.min && s < bin.max).length);
  const maxCount = Math.max(1, ...counts);
  distEl.innerHTML = DIST_BINS.map((bin, i) => {
    const c = counts[i];
    const pct = Math.max(c > 0 ? 4 : 0, (c / maxCount) * 100);
    return `
      <div class="dist-row">
        <div class="dist-label">${bin.label}</div>
        <div class="dist-track"><div class="dist-fill" style="width:${pct}%;background:${bin.color};"></div></div>
        <div class="dist-count">${c}</div>
      </div>`;
  }).join('');
}

function pick(rec, candidates) {
  for (const c of candidates) {
    if (rec[c] !== undefined && rec[c] !== null && rec[c] !== '') return rec[c];
  }
  return null;
}

function num(v) {
  const n = parseFloat(String(v).replace(/[^\d.\-]/g, ''));
  return isNaN(n) ? null : n;
}

function parseDate(v) {
  if (!v) return null;
  const s = String(v);
  // DAMの生の日時(YYYYMMDDHHMMSS / YYYYMMDDHHMM、12〜14桁)は時刻まで含めてパースする
  const numMatch = s.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{0,2})$/);
  if (numMatch) {
    const [, y, mo, d, h, mi, se] = numMatch;
    return new Date(parseInt(y), parseInt(mo) - 1, parseInt(d), parseInt(h), parseInt(mi), se ? parseInt(se) : 0);
  }
  const m = s.match(/(\d{4})[\/\-年]?(\d{1,2})[\/\-月]?(\d{1,2})/);
  if (!m) return null;
  return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
}

let DATA = { modes: {} };
let curPeriod = 'all';
let curMode = 'ai';
let curCustomStart = null; // 'YYYY-MM-DD'
let curCustomEnd = null;   // 'YYYY-MM-DD'
let curPage = 1;
const PAGE_SIZE = 100;
let RENDER_ALL_RECORDS = [];
let CURRENT_PAGE_RECORDS = [];
const songChartInstances = {};
const extraChartInstances = {};

function inPeriod(d, period) {
  if (!d) return period === 'all';
  const now = new Date();
  if (period === 'all') return true;
  if (period === 'year') return d.getFullYear() === now.getFullYear();
  if (period === 'month') return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  if (period === '30d') {
    const diff = (now - d) / (1000 * 60 * 60 * 24);
    return diff >= 0 && diff <= 30;
  }
  if (period === 'custom') {
    if (!curCustomStart && !curCustomEnd) return true;
    const dayMs = 24 * 60 * 60 * 1000;
    if (curCustomStart) {
      const start = new Date(curCustomStart + 'T00:00:00');
      if (d < start) return false;
    }
    if (curCustomEnd) {
      const end = new Date(curCustomEnd + 'T00:00:00').getTime() + dayMs - 1;
      if (d.getTime() > end) return false;
    }
    return true;
  }
  return true;
}

function fmtLogTimestamp(iso) {
  if (!iso) return '----/--/-- --:--';
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// 自分の音域(補正後)を全モードの記録から集計する
// DAMの音域値はメロディ基準でオクターブがずれることがあるため、基準(最高 B4 / 最低 E2)から
// 最高音が4半音以上高ければ -12、最低音が3半音以上低ければ +12 とみなす
const RANGE_ANCHOR_HIGH = 71;
const RANGE_ANCHOR_LOW = 40;
const RANGE_NEW_DAYS = 7;
function computeVocalRange() {
  const items = [];
  Object.values((DATA && DATA.modes) || {}).forEach(list => (list || []).forEach(r => {
    const h = num(r.singingRangeHighest), l = num(r.singingRangeLowest);
    const d = parseDate(pick(r, FIELD_CANDIDATES.date));
    if (h === null || l === null || h <= 0 || l <= 0 || !d) return;
    items.push({
      d,
      h: h > RANGE_ANCHOR_HIGH + 3 ? h - 12 : h,
      l: l < RANGE_ANCHOR_LOW - 2 ? l + 12 : l,
    });
  }));
  if (!items.length) return null;
  items.sort((a, b) => a.d - b.d);
  let hi = -Infinity, lo = Infinity, hiDate = null, loDate = null;
  items.forEach(it => {
    if (it.h > hi) { hi = it.h; hiDate = it.d; }
    if (it.l < lo) { lo = it.l; loDate = it.d; }
  });
  const q = (arr, p) => arr.slice().sort((a, b) => a - b)[Math.min(arr.length - 1, Math.floor(arr.length * p))];
  return {
    hi, lo, hiDate, loDate,
    usualHi: q(items.map(i => i.h), 0.95),
    usualLo: q(items.map(i => i.l), 0.05),
  };
}

// 音域(補正後)カード。鍵盤は詳細画面と同じ buildKeyboardSvg を使う
// 水色=全体の範囲 / ピンク=ふだんの範囲(上位5%・下位5%)
function buildRangeCardHtml(range, nowMs) {
  if (!range) return '';
  const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const nameOf = n => names[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
  const isNew = d => d && (nowMs - d.getTime()) <= RANGE_NEW_DAYS * 86400000;
  const recent = [range.hiDate, range.loDate].filter(isNew).sort((a, b) => b - a)[0];
  const newTag = recent
    ? `<span style="color:#FF8A3D;font-weight:700;margin-left:8px;">NEW ${recent.getMonth() + 1}/${String(recent.getDate()).padStart(2, '0')}</span>`
    : '';
  const kb = buildKeyboardSvg(range.lo, range.hi, range.usualLo, range.usualHi);
  return `
    <div class="dist-wrap">
      <div class="dist-title">音域(補正後)${newTag}</div>
      <div style="margin:8px 0 6px;">${kb}</div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);">
        <span>最低 <b style="color:var(--text-1);font-size:14px;">${nameOf(range.lo)}</b></span>
        <span>ふだん ${nameOf(range.usualLo)}〜${nameOf(range.usualHi)}</span>
        <span>最高 <b style="color:var(--text-1);font-size:14px;">${nameOf(range.hi)}</b></span>
      </div>
    </div>`;
}

// この1回分の演奏の全項目(音程・技法回数・ロングトーン等)を組み立てる
// レーダー軸 → 全国平均フィールドの対応
const RADAR_AVG_FIELDS = {
  radarChartPitch: 'nationalAveragePitch',
  radarChartStability: 'nationalAverageStability',
  radarChartExpressive: 'nationalAverageExpression',
  radarChartRhythm: 'nationalAverageRhythm',
  radarChartVibratoLongtone: 'nationalAverageVibratoAndLongtone',
  radarChartHearing: 'nationalAverageHearing',
};

// モード別の「4つ目のグラフ」設定(Ai=加点減点の2色棒グラフ、DX-G/Ai Heart=単色棒グラフ)
const SECTION_CHART_CONFIG = {
  ai: { type: 'diverging', addPrefix: 'aiSensitivityGraphAddPointsSection', deductPrefix: 'aiSensitivityGraphDeductPointsSection', title: 'Ai感性 加点・減点(24分割)', addColor: '#2DE9DC', deductColor: '#FF3D8A' },
  dxg: { type: 'single', prefix: 'expressionGraphPointsSection', title: '表現力の区間別グラフ(24分割)', color: '#FF8A3D' },

};

// 24分割のセクションフィールド(例: intervalGraphPointsSection01〜24)を配列にして取り出す
function getSectionArray(raw, prefix) {
  const arr = [];
  let anyValue = false;
  for (let i = 1; i <= 24; i++) {
    const key = prefix + String(i).padStart(2, '0');
    const v = num(pick(raw, [key]));
    if (v !== null) anyValue = true;
    arr.push(v);
  }
  return anyValue ? arr : null;
}

// 声域を鍵盤SVGとして描画(曲の音域 vocalRange と自分が出した音域 singingRange をMIDIノート番号として重ねる)
// 曲の音域と自分の音域の重なりが少ない場合、オクターブ違いの可能性を疑って
// ±12半音ずらして重なりが明らかに改善するならそちらを採用する
function adjustSingingOctave(vocalLow, vocalHigh, singLow, singHigh) {
  if (vocalLow === null || vocalHigh === null || singLow === null || singHigh === null) {
    return { singLow, singHigh, shifted: 0 };
  }
  const overlapLen = (loA, hiA, loB, hiB) => Math.max(0, Math.min(hiA, hiB) - Math.max(loA, loB));
  const candidates = [0, -12, 12].map(shift => {
    const lo = singLow + shift, hi = singHigh + shift;
    return { shift, lo, hi, overlap: overlapLen(vocalLow, vocalHigh, lo, hi) };
  });
  const original = candidates[0];
  const best = candidates.slice().sort((a, b) => b.overlap - a.overlap)[0];
  // 元の重なりが曲の音域の3割未満で、オクターブをずらすと重なりが明確に改善する場合だけ採用
  if (best.shift !== 0 && best.overlap > original.overlap && original.overlap <= (vocalHigh - vocalLow) * 0.3) {
    return { singLow: best.lo, singHigh: best.hi, shifted: best.shift };
  }
  return { singLow, singHigh, shifted: 0 };
}

function buildKeyboardSvg(vocalLow, vocalHigh, singLow, singHigh) {
  const values = [vocalLow, vocalHigh, singLow, singHigh].filter(v => v !== null && v !== undefined && !isNaN(v));
  if (!values.length) return '';
  const isBlack = n => [1, 3, 6, 8, 10].includes(((n % 12) + 12) % 12);
  let lowMidi = Math.min(...values) - 3;
  let highMidi = Math.max(...values) + 3;
  let guard = 0;
  while (isBlack(lowMidi) && guard++ < 12) lowMidi--;
  guard = 0;
  while (isBlack(highMidi) && guard++ < 12) highMidi++;

  const whiteIndex = n => { const t = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6]; return Math.floor(n / 12) * 7 + t[((n % 12) + 12) % 12]; };
  const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const noteName = n => noteNames[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);

  const keys = [];
  for (let n = lowMidi; n <= highMidi; n++) keys.push(n);
  const whiteKeys = keys.filter(n => !isBlack(n));
  const wWidth = 20, wHeight = 68, bWidth = 12, bHeight = 40;
  const svgWidth = whiteKeys.length * wWidth;
  const startWhiteIdx = whiteIndex(lowMidi);
  const xFor = n => (whiteIndex(n) - startWhiteIdx) * wWidth;

  const hasA = vocalLow !== null && vocalLow !== undefined && vocalHigh !== null && vocalHigh !== undefined;
  const hasB = singLow !== null && singLow !== undefined && singHigh !== null && singHigh !== undefined;

  let svg = `<svg width="100%" height="${wHeight}" viewBox="0 0 ${svgWidth} ${wHeight}" style="display:block;" role="img" aria-label="声域を表す鍵盤">`;

  const band = (lo, hi, color) => {
    const x1 = xFor(lo);
    const x2 = xFor(hi) + (isBlack(hi) ? bWidth : wWidth);
    svg += `<rect x="${x1}" y="0" width="${x2 - x1}" height="${wHeight}" fill="${color}" opacity="0.16"/>`;
  };
  if (hasA) band(vocalLow, vocalHigh, '#2DE9DC');
  if (hasB) band(singLow, singHigh, '#FF3D8A');

  whiteKeys.forEach(n => {
    const x = xFor(n);
    const inA = hasA && n >= vocalLow && n <= vocalHigh;
    const inB = hasB && n >= singLow && n <= singHigh;
    let fill = '#0A0E17';
    if (inA && inB) fill = 'rgba(150,110,190,0.4)';
    else if (inA) fill = 'rgba(45,233,220,0.35)';
    else if (inB) fill = 'rgba(255,61,138,0.35)';
    svg += `<rect x="${x}" y="0" width="${wWidth - 1}" height="${wHeight}" fill="${fill}" stroke="#1A2740" stroke-width="1"/>`;
    if (((n % 12) + 12) % 12 === 0) {
      svg += `<text x="${x + (wWidth - 1) / 2}" y="${wHeight - 5}" text-anchor="middle" font-size="7.5" fill="#6C8299" font-family="Share Tech Mono, monospace">${noteName(n)}</text>`;
    }
  });
  keys.filter(isBlack).forEach(n => {
    const x = xFor(n) - bWidth / 2;
    const inA = hasA && n >= vocalLow && n <= vocalHigh;
    const inB = hasB && n >= singLow && n <= singHigh;
    let fill = '#05070C';
    if (inA && inB) fill = 'rgba(150,110,190,0.4)';
    else if (inA) fill = 'rgba(45,233,220,0.35)';
    else if (inB) fill = 'rgba(255,61,138,0.35)';
    svg += `<rect x="${x}" y="0" width="${bWidth}" height="${bHeight}" fill="${fill}" stroke="#243349" stroke-width="1"/>`;
  });

  if (hasA) {
    [vocalLow, vocalHigh].forEach(n => {
      const isB = isBlack(n);
      const cx = isB ? xFor(n) : xFor(n) + (wWidth - 1) / 2;
      const y = isB ? bHeight + 9 : wHeight - 22;
      svg += `<text x="${cx}" y="${y}" text-anchor="middle" font-size="8" fill="#2DE9DC" font-family="Share Tech Mono, monospace" font-weight="700">${noteName(n)}</text>`;
    });
  }
  if (hasB) {
    [singLow, singHigh].forEach(n => {
      const isB = isBlack(n);
      const cx = isB ? xFor(n) : xFor(n) + (wWidth - 1) / 2;
      const y = isB ? bHeight + 18 : wHeight - 12;
      svg += `<text x="${cx}" y="${y}" text-anchor="middle" font-size="8" fill="#FF3D8A" font-family="Share Tech Mono, monospace" font-weight="700">${noteName(n)}</text>`;
    });
  }

  svg += `</svg>`;
  return svg;
}

function buildRecordDetailFields(r) {
  const itemDefs = ITEM_LABELS[curMode] || [];
  const itemsHtml = itemDefs.map(([label, candidates, divisor]) => {
    let v = num(pick(r.raw, candidates));
    if (v === null) return '';
    if (divisor) v = v / divisor;
    return `<span class="entry-item">${label} <b>${v.toFixed(divisor ? 3 : 0)}</b></span>`;
  }).filter(Boolean).join('');

  const techDefs = TECHNIQUE_LABELS[curMode] || [];
  const techHtml = techDefs.map(([label, field]) => {
    const v = num(pick(r.raw, [field]));
    if (v === null) return '';
    return `<span class="entry-item">${label} <b>${v}回</b></span>`;
  }).filter(Boolean).join('');

  const detailParts = [];
  const longtoneSkill = num(pick(r.raw, ['longtoneSkill']));
  if (longtoneSkill !== null) detailParts.push(`ロングトーン上手さ <b>${(longtoneSkill / 2).toFixed(1)}/5</b>`);
  const vibratoSkill = num(pick(r.raw, ['vibratoSkill']));
  if (vibratoSkill !== null) detailParts.push(`ビブラート上手さ <b>${(vibratoSkill / 2).toFixed(1)}/5</b>`);
  const stability = num(pick(r.raw, ['radarChartStability']));
  if (stability !== null) detailParts.push(`安定性(震えがち-まっすぐ) <b>${Math.ceil(stability / 10)}/10</b>`);
  const timing = num(pick(r.raw, ['timing']));
  if (timing !== null) {
    const diff = timing - 5;
    const timingLabel = diff === 0 ? '0' : diff > 0 ? `タメ${diff}` : `走り${-diff}`;
    detailParts.push(`リズム <b>${timingLabel}</b>`);
  }
  const vibratoType = num(pick(r.raw, ['vibratoType']));
  if (vibratoType !== null && VIBRATO_TYPE_LABELS[vibratoType]) {
    detailParts.push(`ビブラートタイプ <b>${VIBRATO_TYPE_LABELS[vibratoType]}</b>`);
  }
  const vibratoSec = num(pick(r.raw, ['vibratoTotalSecond']));
  if (vibratoSec !== null) detailParts.push(`ビブラート合計 <b>${Math.floor(vibratoSec / 10)}秒</b>`);
  const intonation = num(pick(r.raw, ['intonation']));
  if (intonation !== null) detailParts.push(`抑揚 <b>${intonation}点</b>`);
  const detailHtml = detailParts.map(p => `<span class="entry-item">${p}</span>`).join('');

  return { itemsHtml, techHtml, detailHtml };
}

// 同じ曲(曲名+アーティスト)の全記録から、歌唱回数・平均点・最高点・スコア推移を集計
function songStats(allRecords, song, artist) {
  const matches = allRecords.filter(r => r.song === song && r.artist === artist);
  const scores = matches.map(r => r.score).filter(s => s !== null);
  const count = matches.length;
  const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null;
  const max = scores.length ? Math.max(...scores) : null;
  const sorted = matches.slice().filter(r => r.date && r.score !== null).sort((a, b) => a.date - b.date);
  return { count, avg, max, series: sorted };
}

    const hasData = secConfig.type === 'diverging'
      ? (getSectionArray(r.raw, secConfig.addPrefix) || getSectionArray(r.raw, secConfig.deductPrefix))
      : getSectionArray(r.raw, secConfig.prefix);
    if (hasData) {
      techChartHtml = `
        <div class="detail-chart-title">${secConfig.title}</div>
        <div class="detail-chart-wrap" style="height:98px;"><canvas id="techChart-${idx}" role="img" aria-label="${secConfig.title}"></canvas></div>
      `;
    }
  }

  const chartHtml = stats.series.length >= 2 ? `
    <div class="detail-chart-title">スコア推移</div>
    <div class="detail-chart-wrap"><canvas id="songChart-${idx}" role="img" aria-label="${escapeHtml(r.song)}のスコア推移"></canvas></div>
  ` : '';

  return `
    ${statsCards}
    ${itemsHtml ? `<div class="entry-items" style="margin-bottom:6px;">${itemsHtml}</div>` : ''}
    ${techHtml ? `<div class="entry-items" style="margin-bottom:4px;">${techHtml}</div>` : ''}
    ${detailHtml ? `<div class="entry-items" style="margin-bottom:6px;">${detailHtml}</div>` : ''}
    ${radarHtml}
    ${chartHtml}
    ${intervalHtml}
    ${techChartHtml}
    ${keyboardHtml}
  `;
}

function renderSongChart(idx, stats) {
  const canvas = document.getElementById(`songChart-${idx}`);
  if (!canvas || typeof Chart === 'undefined') return;
  if (songChartInstances[idx]) {
    songChartInstances[idx].destroy();
    delete songChartInstances[idx];
  }
  songChartInstances[idx] = new Chart(canvas, {
    type: 'line',
    data: {
      labels: stats.series.map(r => r.date.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' })),
      datasets: [{
        data: stats.series.map(r => r.score),
        borderColor: '#2DE9DC',
        backgroundColor: 'rgba(45,233,220,0.08)',
        fill: true,
        tension: 0.3,
        pointRadius: 3,
        pointBackgroundColor: '#2DE9DC',
        borderWidth: 2,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#6C8299', font: { size: 9 } }, grid: { display: false } },
        y: { ticks: { color: '#6C8299', font: { size: 9 } }, grid: { color: '#1A2740' } },
      },
    },
  });
}

// レーダー(自分 vs 全国平均)・音程区間別グラフ・モード別の4つ目のグラフをまとめて描画
function renderDetailCharts(idx, r) {
  if (typeof Chart === 'undefined') return;
  extraChartInstances[idx] = extraChartInstances[idx] || [];

  const axisKeys = RADAR_AXES[curMode] || [];
  const radarCanvas = document.getElementById(`radarChart-${idx}`);
  if (radarCanvas && axisKeys.length >= 3) {
    const selfValues = axisKeys.map(k => num(pick(r.raw, [k])) || 0);
    const avgValues = axisKeys.map(k => {
      const avgField = RADAR_AVG_FIELDS[k];
      return avgField ? num(pick(r.raw, [avgField])) : null;
    });
    const hasAvg = avgValues.some(v => v !== null);
    const datasets = [{
      label: '自分',
      data: selfValues,
      borderColor: '#2DE9DC',
      backgroundColor: 'rgba(45,233,220,0.18)',
      pointRadius: 2,
      borderWidth: 1.5,
    }];
    if (hasAvg) {
      datasets.push({
        label: '全国平均',
        data: avgValues.map(v => v === null ? 0 : v),
        borderColor: '#8B93A8',
        backgroundColor: 'rgba(139,147,168,0.05)',
        borderDash: [4, 3],
        pointRadius: 0,
        borderWidth: 1.5,
      });
    }
    extraChartInstances[idx].push(new Chart(radarCanvas, {
      type: 'radar',
      data: { labels: axisKeys.map(k => RADAR_LABELS[k] || ''), datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          r: {
            min: 0, max: 100,
            ticks: { display: false },
            grid: { color: '#1A2740' },
            angleLines: { color: '#1A2740' },
            pointLabels: { color: '#6C8299', font: { size: 9 } },
          },
        },
      },
    }));
  }

  const intervalArr = getSectionArray(r.raw, 'intervalGraphPointsSection');
  const intervalCanvas = document.getElementById(`intervalChart-${idx}`);
  if (intervalCanvas && intervalArr) {
    extraChartInstances[idx].push(new Chart(intervalCanvas, {
      type: 'line',
      data: {
        labels: intervalArr.map((_, i) => i + 1),
        datasets: [{
          data: intervalArr,
          borderColor: '#2DE9DC',
          backgroundColor: 'rgba(45,233,220,0.08)',
          fill: true,
          tension: 0,
          pointRadius: 2,
          pointBackgroundColor: '#2DE9DC',
          borderWidth: 1.5,
          spanGaps: true,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#6C8299', font: { size: 8 }, maxTicksLimit: 6 }, grid: { display: false } },
          y: { min: 40, max: 100, ticks: { color: '#6C8299', font: { size: 8 } }, grid: { color: '#1A2740' } },
        },
      },
    }));
  }

  const secConfig = SECTION_CHART_CONFIG[curMode];
  const techCanvas = document.getElementById(`techChart-${idx}`);
  if (techCanvas && secConfig) {
    let datasets, stacked = false;
    if (secConfig.type === 'diverging') {
      const addArr = getSectionArray(r.raw, secConfig.addPrefix) || Array(24).fill(0);
      const deductArr = getSectionArray(r.raw, secConfig.deductPrefix) || Array(24).fill(0);
      datasets = [
        { data: addArr.map(v => v || 0), backgroundColor: secConfig.addColor },
        { data: deductArr.map(v => v ? -Math.abs(v) : 0), backgroundColor: secConfig.deductColor },
      ];
      stacked = true;
    } else {
      const arr = getSectionArray(r.raw, secConfig.prefix) || [];
      datasets = [{ data: arr, backgroundColor: secConfig.color, borderRadius: 2 }];
    }
    extraChartInstances[idx].push(new Chart(techCanvas, {
      type: 'bar',
      data: { labels: Array.from({ length: 24 }, (_, i) => i + 1), datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { stacked, ticks: { color: '#6C8299', font: { size: 8 }, maxTicksLimit: 6 }, grid: { display: false } },
          y: { stacked, ticks: { color: '#6C8299', font: { size: 8 } }, grid: { color: '#1A2740' } },
        },
      },
    }));
  }
}

function toggleSongDetail(idx) {
  const panel = document.getElementById(`detail-${idx}`);
  const chev = document.getElementById(`chev-${idx}`);
  if (!panel) return;
  const isOpen = panel.classList.contains('open');
  if (isOpen) {
    panel.classList.remove('open');
    panel.innerHTML = '';
    if (chev) chev.classList.remove('open');
    if (songChartInstances[idx]) {
      songChartInstances[idx].destroy();
      delete songChartInstances[idx];
    }
    if (extraChartInstances[idx]) {
      extraChartInstances[idx].forEach(c => c.destroy());
      delete extraChartInstances[idx];
    }
    return;
  }
  const r = CURRENT_PAGE_RECORDS[idx];
  if (!r) return;
  panel.innerHTML = buildDetailPanelHtml(r, idx);
  panel.classList.add('open');
  if (chev) chev.classList.add('open');
  const stats = songStats(RENDER_ALL_RECORDS, r.song, r.artist);
  if (stats.series.length >= 2) renderSongChart(idx, stats);
  renderDetailCharts(idx, r);
}

function render() {
  updateHeader(DATA.modes[curMode] || [], DATA.updatedAt);

  const allRecords = (DATA.modes[curMode] || []).map(r => {
    const rawDateStr = pick(r, FIELD_CANDIDATES.date);
    let timeStr = '';
    if (rawDateStr && /^\d{12,14}$/.test(String(rawDateStr))) {
      const s = String(rawDateStr);
      timeStr = `${s.slice(8,10)}:${s.slice(10,12)}`;
    }
    return {
      raw: r,
      song: pick(r, FIELD_CANDIDATES.song) || '(曲名不明)',
      artist: pick(r, FIELD_CANDIDATES.artist) || '',
      score: num(pick(r, FIELD_CANDIDATES.score)),
      date: parseDate(rawDateStr),
      time: timeStr,
    };
  });
  RENDER_ALL_RECORDS = allRecords;

  const records = allRecords.filter(r => inPeriod(r.date, curPeriod));

  records.sort((a, b) => (b.date || 0) - (a.date || 0));

  const scores = records.map(r => r.score).filter(s => s !== null);
  const count = records.length;
  const avg = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length) : null;
  const max = scores.length ? Math.max(...scores) : null;

  const statsRow = document.getElementById('statsRow');
  statsRow.innerHTML = `
    <div class="stat-card"><div class="stat-label">記録数</div><div class="stat-value">${count}曲</div></div>
    <div class="stat-card"><div class="stat-label">平均点</div><div class="stat-value accent-score">${avg !== null ? avg.toFixed(2) : '--'}</div></div>
    <div class="stat-card"><div class="stat-label">最高点</div><div class="stat-value accent-score">${max !== null ? max.toFixed(2) : '--'}</div></div>
  `;

  renderDistribution(scores);

  const rangeEl = document.getElementById('rangeCard');
  if (rangeEl) {
    const ms = DATA.updatedAt ? new Date(DATA.updatedAt).getTime() : NaN;
    rangeEl.innerHTML = buildRangeCardHtml(computeVocalRange(), isNaN(ms) ? Date.now() : ms);
  }

  const itemGrid = document.getElementById('itemGrid');
  itemGrid.innerHTML = '';
  const itemDefs = ITEM_LABELS[curMode] || [];
  itemDefs.forEach(([label, candidates, divisor]) => {
    const vals = records
      .map(r => num(pick(r.raw, candidates)))
      .filter(v => v !== null)
      .map(v => (divisor ? v / divisor : v));
    const itemAvg = vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length) : null;
    const card = document.createElement('div');
    card.className = 'stat-card item-card';
    card.innerHTML = `<div class="stat-label">${label} 平均</div><div class="stat-value">${itemAvg !== null ? itemAvg.toFixed(divisor ? 3 : 1) : '--'}</div>`;
    itemGrid.appendChild(card);
  });

  const historyList = document.getElementById('historyList');
  const pagerEl = document.getElementById('pager');
  const totalPages = Math.max(1, Math.ceil(records.length / PAGE_SIZE));
  if (curPage > totalPages) curPage = totalPages;
  if (curPage < 1) curPage = 1;
  const pageStart = (curPage - 1) * PAGE_SIZE;
  const pageRecords = records.slice(pageStart, pageStart + PAGE_SIZE);
  CURRENT_PAGE_RECORDS = pageRecords;

  if (records.length === 0) {
    historyList.innerHTML = '<div class="empty">この期間の記録はまだありません</div>';
    pagerEl.innerHTML = '';
  } else {
    historyList.innerHTML = pageRecords.map((r, i) => {
      const keyVal = pick(r.raw, ['lastPerformKey']);
      const origKeyBadge = formatOriginalKeyBadge(r.raw.requestNo);

      return `
      <div class="entry" data-idx="${i}">
        <div class="entry-score">${r.score !== null ? r.score.toFixed(2) : '--'}</div>
        <div class="entry-body">
          <div class="entry-head">
            <button type="button" class="entry-song-link" data-idx="${i}">${escapeHtml(r.song)}</button>
            <span class="entry-chevron" id="chev-${i}">▾</span>
          </div>
          <div class="entry-artist">${escapeHtml(r.artist)}</div>
          <div class="entry-date">${r.date ? r.date.toLocaleDateString('ja-JP') : ''}${r.time ? ' ' + r.time : ''}${keyVal ? ` <span class="entry-key">キー ${escapeHtml(keyVal)}</span>` : ''}${origKeyBadge}</div>
          <div class="entry-detail" id="detail-${i}"></div>
        </div>
      </div>
    `;
    }).join('');

    pagerEl.innerHTML = `
      <button class="pager-btn" id="pagerPrev" ${curPage <= 1 ? 'disabled' : ''}>← 前へ</button>
      <span class="pager-info">${curPage} / ${totalPages} ページ(全${records.length}件)</span>
      <button class="pager-btn" id="pagerNext" ${curPage >= totalPages ? 'disabled' : ''}>次へ →</button>
    `;
    const prevBtn = document.getElementById('pagerPrev');
    const nextBtn = document.getElementById('pagerNext');
    if (prevBtn) prevBtn.addEventListener('click', () => { curPage--; render(); });
    if (nextBtn) nextBtn.addEventListener('click', () => { curPage++; render(); });
  }
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// requestNoから原曲キー(DAMの機種標準キーと原曲との半音差)のバッジHTMLを組み立てる
function formatOriginalKeyBadge(requestNo) {
  const shift = (DATA.originalKeys || {})[requestNo];
  if (shift === undefined || shift === null) return '';
  const label = shift > 0 ? `+${shift}` : `${shift}`;
  return ` <span class="entry-origkey">原曲 ${label}</span>`;
}

document.getElementById('periodBar').addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('#periodBar .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  curPeriod = btn.dataset.period;
  curPage = 1;

  const customRangeEl = document.getElementById('customRange');
  if (curPeriod === 'custom') {
    customRangeEl.classList.add('show');
  } else {
    customRangeEl.classList.remove('show');
  }
  render();
});

function onCustomRangeChange() {
  curCustomStart = document.getElementById('customStart').value || null;
  curCustomEnd = document.getElementById('customEnd').value || null;
  curPage = 1;
  if (curPeriod === 'custom') render();
}
document.getElementById('customStart').addEventListener('change', onCustomRangeChange);
document.getElementById('customEnd').addEventListener('change', onCustomRangeChange);

document.getElementById('historyList').addEventListener('click', (e) => {
  const btn = e.target.closest('.entry-song-link');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  toggleSongDetail(idx);
});

document.getElementById('modeTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('#modeTabs .tab').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  curMode = btn.dataset.mode;
  curPage = 1;
  render();
});

fetch('./data.json?_=' + Date.now())
  .then(r => {
    if (!r.ok) throw new Error('採点データを取得できませんでした');
    return r.json();
  })
  .then(json => {
    if (!json || !json.modes || typeof json.modes !== 'object') throw new Error('採点データの形式が不正です');
    DATA = json;
    headerLoadState = 'ready';
    render();
  })
  .catch(() => {
    headerLoadState = 'error';
    render();
  });
</script>
</body>
</html>
